# Docker-compose profile overrides. Activated by SPRING_PROFILES_ACTIVE=docker in the compose
# file. Keep this file thin — only settings that genuinely differ from the local defaults.

spring:
  datasource:
    # rewriteBatchedStatements matters for the click-flush batch UPDATE. The default JDBC URL in
    # application.yml already includes it; this override reinforces it for the container path.
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/urlshortener?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&rewriteBatchedStatements=true}

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  # No trusted proxies by default in-container — set APP_TRUSTED_PROXIES only when a known LB
  # sits in front and sanitises XFF headers.

logging:
  level:
    com.urlshortner: INFO

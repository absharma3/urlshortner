name: urlshortener

services:
  mysql:
    image: mysql:8.0
    container_name: urlshortener-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpw}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-urlshortener}
      MYSQL_USER: ${MYSQL_USER:-urlshortener}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-urlshortener}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-authentication-plugin=caching_sha2_password
      - --skip-name-resolve
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootpw}", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [urlshortener-net]

  redis:
    image: redis:7-alpine
    container_name: urlshortener-redis
    restart: unless-stopped
    # NOTE: allkeys-lru evicts *any* key under memory pressure, including click counters that
    # haven't been flushed yet. Bounded loss is acceptable (at most one flush cycle) — if you
    # need stronger durability guarantees, use volatile-lru + explicit TTLs on the click keys.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks: [urlshortener-net]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: urlshortener-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-urlshortener}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&rewriteBatchedStatements=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-urlshortener}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-urlshortener}
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_THREADS_VIRTUAL_ENABLED: "true"
      # Actuator on 8081 (internal only). See application.yml management.server.port.
      MANAGEMENT_SERVER_PORT: "8081"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus
    ports:
      - "8080:8080"
      # Uncomment to expose actuator externally (dev only).
      # - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/healthz > /dev/null || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 30s
    networks: [urlshortener-net]

networks:
  urlshortener-net:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
